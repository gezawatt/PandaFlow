name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git cmake curl unzip ca-certificates

      - name: Cross-compilar faad2 (AAC)
        run: ./scripts/build-faad2.sh

      - name: Descargar makerom y bannertool
        run: ./scripts/fetch-tools.sh

      - name: Compilar .3dsx y .cia
        run: |
          make
          make cia

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: PandaFlow
          path: |
            pandaflow.3dsx
            pandaflow.cia
          if-no-files-found: error
