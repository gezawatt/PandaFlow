name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # crear releases al empujar un tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git cmake curl unzip ca-certificates

      - name: Cross-compilar faad2 (AAC)
        run: ./scripts/build-faad2.sh

      - name: Compilar .3dsx
        run: make

      - name: Subir artefacto (.3dsx)
        uses: actions/upload-artifact@v4
        with:
          name: PandaFlow-3dsx
          path: pandaflow.3dsx
          if-no-files-found: error

      # Al empujar un tag v* se publica una Release con el .3dsx.
      # Universal Updater jala el binario desde aqui.
      - name: Publicar Release (.3dsx)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pandaflow.3dsx
          fail_on_unmatched_files: true
