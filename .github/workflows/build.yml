name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends git cmake curl unzip ca-certificates

      - name: Cross-compilar faad2 (AAC)
        run: ./scripts/build-faad2.sh

      - name: Compilar .3dsx
        run: make

      - name: Subir artefacto (.3dsx)
        uses: actions/upload-artifact@v4
        with:
          name: PandaFlow-3dsx
          path: pandaflow.3dsx
          if-no-files-found: error

      # Nota: el .cia se genera en local con 'make cia' (scripts/fetch-tools.sh);
      # el bannertool precompilado requiere una glibc mas nueva que la del contenedor.
